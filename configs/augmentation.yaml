train:

  resize:

    market:
      median_width: 64
      median_height: 128
      mean_width: 64
      mean_height: 128

    pa:
      median_width: 74
      median_height: 202
      mean_width: 86
      mean_height: 228

    peta:
      median_width: 73
      median_height: 160
      mean_width: 73
      mean_height: 160

    median_width: 256
    median_height: 256

    mean_width: 256
    mean_height: 256

  horizontal_flip:
    p: 0.5

  random_resized_crop:
    p: 1.0
    scale: [0.6, 1.0]
    ratio: [0.85, 1.15]

  affine:
    scale: [0.9, 1.1]
    translate_percent: [-0.05, 0.05]
    rotate: [-5, 5]
    shear: [-3, 3]
    p: 0.3

  safe_rotate:
    limit: 10
    p: 0.2

  coarse_dropout:
    num_holes_range: [1, 4]
    hole_height_range: [0.08, 0.20]
    hole_width_range: [0.08, 0.25]
    p: 0.3

  gaussian_blur:
    blur_range: [1, 3]
    p: 0.2

  color_jitter:
    p: 0.8
    brightness_range: [0.8, 1.2]
    contrast_range: [0.8, 1.2]
    saturation_range: [0.8, 1.2]
    hue_range: [-0.05, 0.05]

  rgb_shift:
    r_shift_limit: 15
    g_shift_limit: 15
    b_shift_limit: 15
    p: 0.2

  image_compression:
    quality_range: [70, 100]
    p: 0.2

  norm:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  
